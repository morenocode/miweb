name: Build Animo Hoy v3.8 Android

on:
  push:
    branches:
      - build-animo-hoy-v38-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create Flutter project and apply v3.8
        run: |
          rm -rf generated_app
          flutter create --platforms=android --org com.modu --project-name animohoy generated_app
          cp animo-hoy-source/pubspec.yaml generated_app/pubspec.yaml
          cp animo-hoy-source/lib/main.dart generated_app/lib/main.dart
          cp animo-hoy-source/lib/dynamic_missions.dart generated_app/lib/dynamic_missions.dart
          cp animo-hoy-source/lib/moti_minute.dart generated_app/lib/moti_minute.dart
          cp animo-hoy-source/lib/moti_bubbles_game.dart generated_app/lib/moti_bubbles_game.dart
          sed -i 's/version: 3.0.0+3/version: 3.8.0+11/' generated_app/pubspec.yaml
          python3 tools/patch_v31.py generated_app/lib/main.dart
          python3 tools/patch_v32.py generated_app/lib/main.dart
          python3 tools/patch_v33.py generated_app/lib/main.dart
          python3 tools/patch_v34.py generated_app/lib/main.dart
          python3 tools/patch_moti_expressive.py generated_app/lib/moti_minute.dart
          python3 tools/patch_bubbles_v35.py generated_app/lib/moti_bubbles_game.dart
          (cd generated_app/lib && patch -p0 < ../../tools/bubbles_v36.patch)
          python3 tools/patch_bubbles_v37.py generated_app/lib/moti_bubbles_game.dart
          python3 tools/apply_bubbles_v38.py generated_app/lib/moti_bubbles_game.dart
          sed -i 's/android:label="animohoy"/android:label="Ánimo Hoy"/' generated_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' generated_app/android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' generated_app/android/app/build.gradle.kts

      - name: Generate app sounds
        run: |
          mkdir -p generated_app/assets/sounds
          python3 <<'PY'
          import math, os, random, struct, wave
          SR=44100; root='generated_app/assets/sounds'
          def write(name,data):
              with wave.open(os.path.join(root,name),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR); w.writeframes(b''.join(data))
          def tone(name,notes,dur=.5,vol=.14):
              n=int(SR*dur); seg=max(1,n//len(notes)); out=[]
              for i in range(n):
                  f=notes[min(len(notes)-1,i//seg)]; x=(i%seg)/seg; env=min(1,x/.08,(1-x)/.18); t=i/SR
                  v=math.sin(2*math.pi*f*t)+.25*math.sin(4*math.pi*f*t)
                  out.append(struct.pack('<h',int(32767*vol*max(0,env)*v/1.25)))
              write(name,out)
          specs={
            'feliz.wav':([659,784,988],.58,.22),'tranquilo.wav':([392,523,659],.72,.15),'normal.wav':([440,554],.48,.16),
            'triste.wav':([440,392,330],.78,.12),'ansioso.wav':([494,466,440],.62,.11),'cansado.wav':([349,294],.82,.10),
            'enojado.wav':([392,370,349],.45,.15),'moti_salto.wav':([523,659,880],.23,.18),'moti_meta.wav':([523,659,784,1047],.72,.22),
            'moti_fin.wav':([440,392],.38,.10),'reloj_tick.wav':([880],.12,.12),'reloj_alarma.wav':([880,660,880],.34,.18),
            'moti_caida.wav':([740,560,410,280],.52,.16)}
          for n,(notes,d,v) in specs.items(): tone(n,notes,d,v)
          total=int(SR*12); out=[]
          for i in range(total):
              t=i/SR; phase=t%6; env=.5-.5*math.cos(2*math.pi*phase/6); sample=math.sin(2*math.pi*220*t)+.35*math.sin(2*math.pi*330*t)
              out.append(struct.pack('<h',int(32767*.035*env*sample/1.35)))
          write('respirar.wav',out)
          rng=random.Random(34); total=int(SR*.18); out=[]
          for i in range(total):
              t=i/SR; x=t/.18; env=(1-x)**3; f=760-430*x; v=.72*math.sin(2*math.pi*f*t)+.28*(rng.random()*2-1)
              out.append(struct.pack('<h',int(32767*.18*env*v)))
          write('burbuja_pop.wav',out)
          tone('moti_risa.wav',[520,650,780,900],.78,.14)
          rng=random.Random(35); total=int(SR*.34); out=[]
          for i in range(total):
              t=i/SR; x=t/.34; env=(1-x)**2; v=.58*(rng.random()*2-1)+.42*math.sin(2*math.pi*(170-90*x)*t)
              out.append(struct.pack('<h',int(32767*.19*env*v)))
          write('escalon_crack.wav',out)
          PY

      - name: Create Moti icon
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path('generated_app/android/app/src/main/res'); img=Image.new('RGB',(1024,1024),(255,239,232)); d=ImageDraw.Draw(img)
          d.rounded_rectangle((190,230,834,865),radius=250,fill=(240,68,50)); d.ellipse((330,455,400,525),fill='white'); d.ellipse((624,455,694,525),fill='white')
          d.ellipse((350,470,385,510),fill=(61,39,34)); d.ellipse((644,470,679,510),fill=(61,39,34)); d.ellipse((380,565,650,735),fill=(201,47,34))
          d.rounded_rectangle((420,585,610,625),radius=12,fill='white'); d.ellipse((455,670,575,720),fill=(255,130,151)); d.ellipse((485,100,720,340),fill=(69,168,93)); d.line((535,335,595,175),fill=(49,133,74),width=28)
          for folder,size in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
              p=root/folder; p.mkdir(parents=True,exist_ok=True); icon=img.resize((size,size),Image.Resampling.LANCZOS); icon.save(p/'ic_launcher.png'); icon.save(p/'ic_launcher_round.png')
          PY

      - name: Add home-screen widget
        run: |
          mkdir -p generated_app/android/app/src/main/res/{layout,xml,drawable} generated_app/android/app/src/main/kotlin/com/modu/animohoy
          cat > generated_app/android/app/src/main/res/drawable/moti_widget_bg.xml <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#FFF0EA"/><corners android:radius="24dp"/></shape>
          XML
          cat > generated_app/android/app/src/main/res/layout/moti_widget.xml <<'XML'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/widget_root" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal" android:gravity="center_vertical" android:background="@drawable/moti_widget_bg" android:padding="12dp"><ImageView android:layout_width="62dp" android:layout_height="62dp" android:src="@mipmap/ic_launcher" android:contentDescription="Moti"/><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:paddingStart="12dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ánimo Hoy" android:textColor="#3D2722" android:textStyle="bold" android:textSize="16sp"/><TextView android:id="@+id/widget_phrase" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="4dp" android:text="¿Cómo te sientes hoy?" android:textColor="#725D56" android:textSize="13sp" android:maxLines="2"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="5dp" android:text="Toca para abrir con Moti →" android:textColor="#C92F22" android:textStyle="bold" android:textSize="11sp"/></LinearLayout></LinearLayout>
          XML
          cat > generated_app/android/app/src/main/res/xml/moti_widget_info.xml <<'XML'
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="220dp" android:minHeight="90dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/moti_widget" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>
          XML
          cat > generated_app/android/app/src/main/kotlin/com/modu/animohoy/MotiWidget.kt <<'KOTLIN'
          package com.modu.animohoy
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.widget.RemoteViews
          class MotiWidget:AppWidgetProvider(){override fun onUpdate(c:Context,m:AppWidgetManager,ids:IntArray){for(id in ids){val i=c.packageManager.getLaunchIntentForPackage(c.packageName);val p=PendingIntent.getActivity(c,id,i,PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE);val v=RemoteViews(c.packageName,R.layout.moti_widget);v.setOnClickPendingIntent(R.id.widget_root,p);m.updateAppWidget(id,v)}}}
          KOTLIN
          python3 <<'PY'
          from pathlib import Path
          p=Path('generated_app/android/app/src/main/AndroidManifest.xml'); s=p.read_text(); r='''<receiver android:name=".MotiWidget" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/moti_widget_info"/></receiver>'''; p.write_text(s.replace('    </application>',r+'    </application>'))
          PY

      - name: Resolve and analyze
        run: |
          cd generated_app
          flutter pub get
          flutter analyze lib

      - name: Build trial APK
        run: |
          cd generated_app
          flutter build apk --release

      - name: Collect files
        run: |
          mkdir -p dist/source/lib
          cp generated_app/build/app/outputs/flutter-apk/app-release.apk dist/Animo-Hoy-Moti-v3.8.0-PRUEBA.apk
          cp generated_app/lib/*.dart dist/source/lib/
          cp generated_app/pubspec.yaml dist/source/pubspec.yaml
          cat > dist/LEEME.txt <<'TXT'
          Ánimo Hoy v3.8.0 - APK de prueba
          Burbujas de Moti: vacío visual con nubes animadas, bandera roja en la cima,
          escalera elevada para ganar espacio y mejor lectura de la caída.
          Se eliminaron los textos MOTI/META y los emojis de instrucciones,
          reemplazándolos por iconos Material profesionales y reglas compactas.
          TXT

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: animo-hoy-moti-v38
          path: dist/*
          if-no-files-found: error
          retention-days: 7
