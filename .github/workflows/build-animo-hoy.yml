name: Build Animo Hoy Android

on:
  push:
    branches:
      - build-animo-hoy-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create Flutter Android project
        shell: bash
        run: |
          rm -rf generated_app
          flutter create --platforms=android --org com.modu --project-name animohoy generated_app
          cp animo-hoy-source/pubspec.yaml generated_app/pubspec.yaml
          cp animo-hoy-source/lib/main.dart generated_app/lib/main.dart
          sed -i 's/android:label="animohoy"/android:label="Ánimo Hoy"/' generated_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' generated_app/android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' generated_app/android/app/build.gradle.kts
          cd generated_app
          flutter pub get

      - name: Create custom icon
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path('generated_app/android/app/src/main/res')
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          img = Image.new('RGB', (1024,1024), (108,99,232))
          d = ImageDraw.Draw(img)
          d.ellipse((185,185,839,839), fill=(255,255,255))
          d.ellipse((360,390,430,460), fill=(108,99,232))
          d.ellipse((594,390,664,460), fill=(108,99,232))
          d.arc((350,430,675,700), 15, 165, fill=(108,99,232), width=42)
          for folder, size in sizes.items():
              p = root / folder
              p.mkdir(parents=True, exist_ok=True)
              icon = img.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(p/'ic_launcher.png')
              icon.save(p/'ic_launcher_round.png')
          PY

      - name: Build installable APK
        shell: bash
        run: |
          cd generated_app
          flutter build apk --release

      - name: Build unsigned AAB
        shell: bash
        run: |
          cd generated_app
          sed -i '/signingConfig = signingConfigs.getByName("debug")/d' android/app/build.gradle.kts
          flutter clean
          flutter pub get
          flutter build appbundle --release

      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist
          cp generated_app/build/app/outputs/bundle/release/app-release.aab dist/Animo-Hoy-v1.0.0-unsigned.aab
          # Rebuild APK after clean so it is available in dist
          cd generated_app
          sed -i '/release {/a\            signingConfig = signingConfigs.getByName("debug")' android/app/build.gradle.kts
          flutter build apk --release
          cd ..
          cp generated_app/build/app/outputs/flutter-apk/app-release.apk dist/Animo-Hoy-v1.0.0.apk
          cp animo-hoy-source/lib/main.dart dist/main.dart
          cp animo-hoy-source/pubspec.yaml dist/pubspec.yaml

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: animo-hoy-build
          path: dist/*
          if-no-files-found: error
          retention-days: 7
