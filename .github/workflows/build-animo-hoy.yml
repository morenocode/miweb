name: Build Animo Hoy v3 Android

on:
  push:
    branches:
      - build-animo-hoy-v3-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create Flutter Android project
        shell: bash
        run: |
          rm -rf generated_app
          flutter create --platforms=android --org com.modu --project-name animohoy generated_app
          cp animo-hoy-source/pubspec.yaml generated_app/pubspec.yaml
          cp animo-hoy-source/lib/main.dart generated_app/lib/main.dart
          sed -i 's/android:label="animohoy"/android:label="Ánimo Hoy"/' generated_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' generated_app/android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' generated_app/android/app/build.gradle.kts

      - name: Generate original emotion sounds
        shell: bash
        run: |
          mkdir -p generated_app/assets/sounds
          python3 <<'PY'
          import math, os, struct, wave
          SR = 44100
          root = 'generated_app/assets/sounds'

          def write_tone(name, notes, duration=0.55, volume=0.22):
              frames = []
              total = int(SR * duration)
              seg = max(1, total // len(notes))
              for i in range(total):
                  idx = min(len(notes)-1, i // seg)
                  f = notes[idx]
                  local = (i % seg) / seg
                  attack = min(1.0, local / 0.08)
                  release = min(1.0, (1.0-local) / 0.18)
                  env = min(attack, release)
                  t = i / SR
                  sample = math.sin(2*math.pi*f*t) + 0.28*math.sin(2*math.pi*f*2*t)
                  value = int(32767 * volume * env * sample / 1.28)
                  frames.append(struct.pack('<h', max(-32767, min(32767, value))))
              with wave.open(os.path.join(root, name), 'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR); w.writeframes(b''.join(frames))

          write_tone('feliz.wav', [659, 784, 988], .58, .22)
          write_tone('tranquilo.wav', [392, 523, 659], .72, .15)
          write_tone('normal.wav', [440, 554], .48, .16)
          write_tone('triste.wav', [440, 392, 330], .78, .12)
          write_tone('ansioso.wav', [494, 466, 440], .62, .11)
          write_tone('cansado.wav', [349, 294], .82, .10)
          write_tone('enojado.wav', [392, 370, 349], .45, .15)

          total = int(SR * 12)
          frames = []
          for i in range(total):
              t = i / SR
              phase = t % 6.0
              envelope = 0.5 - 0.5 * math.cos(2*math.pi*phase/6.0)
              sample = math.sin(2*math.pi*220*t) + .35*math.sin(2*math.pi*330*t)
              value = int(32767 * .035 * envelope * sample / 1.35)
              frames.append(struct.pack('<h', value))
          with wave.open(os.path.join(root, 'respirar.wav'), 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR); w.writeframes(b''.join(frames))
          PY

      - name: Create red Moti app icon
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path('generated_app/android/app/src/main/res')
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          img = Image.new('RGB', (1024,1024), (255,239,232))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((190,230,834,865), radius=250, fill=(240,68,50))
          d.ellipse((330,455,400,525), fill=(61,39,34))
          d.ellipse((624,455,694,525), fill=(61,39,34))
          d.arc((365,495,660,720), 10, 170, fill=(61,39,34), width=35)
          d.ellipse((265,565,370,625), fill=(255,154,138))
          d.ellipse((654,565,759,625), fill=(255,154,138))
          d.ellipse((485,100,720,340), fill=(69,168,93))
          d.line((535,335,595,175), fill=(49,133,74), width=28)
          for folder, size in sizes.items():
              p = root / folder
              p.mkdir(parents=True, exist_ok=True)
              icon = img.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(p/'ic_launcher.png')
              icon.save(p/'ic_launcher_round.png')
          PY

      - name: Add Moti Android home-screen widget
        shell: bash
        run: |
          mkdir -p generated_app/android/app/src/main/res/layout
          mkdir -p generated_app/android/app/src/main/res/xml
          mkdir -p generated_app/android/app/src/main/res/drawable
          mkdir -p generated_app/android/app/src/main/kotlin/com/modu/animohoy

          cat > generated_app/android/app/src/main/res/drawable/moti_widget_bg.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFF0EA" />
              <corners android:radius="24dp" />
              <padding android:left="14dp" android:top="12dp" android:right="14dp" android:bottom="12dp" />
          </shape>
          XML

          cat > generated_app/android/app/src/main/res/layout/moti_widget.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:background="@drawable/moti_widget_bg"
              android:padding="12dp">
              <ImageView
                  android:layout_width="62dp"
                  android:layout_height="62dp"
                  android:src="@mipmap/ic_launcher"
                  android:contentDescription="Moti" />
              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:paddingStart="12dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Ánimo Hoy"
                      android:textColor="#3D2722"
                      android:textStyle="bold"
                      android:textSize="16sp" />
                  <TextView
                      android:id="@+id/widget_phrase"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:text="¿Cómo te sientes hoy?"
                      android:textColor="#725D56"
                      android:textSize="13sp"
                      android:maxLines="2" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="5dp"
                      android:text="Toca para abrir con Moti →"
                      android:textColor="#C92F22"
                      android:textStyle="bold"
                      android:textSize="11sp" />
              </LinearLayout>
          </LinearLayout>
          XML

          cat > generated_app/android/app/src/main/res/xml/moti_widget_info.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="220dp"
              android:minHeight="90dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/moti_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          XML

          cat > generated_app/android/app/src/main/kotlin/com/modu/animohoy/MotiWidget.kt <<'KOTLIN'
          package com.modu.animohoy

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.widget.RemoteViews
          import java.util.Calendar

          class MotiWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  val phrases = arrayOf(
                      "¿Cómo te sientes hoy?",
                      "Un paso pequeño también cuenta.",
                      "Moti está aquí contigo.",
                      "Regálate un minuto para ti.",
                      "Respira. Hoy no tienes que hacerlo todo."
                  )
                  val phrase = phrases[Calendar.getInstance().get(Calendar.DAY_OF_YEAR) % phrases.size]
                  for (appWidgetId in appWidgetIds) {
                      val launchIntent = context.packageManager.getLaunchIntentForPackage(context.packageName)
                      val pendingIntent = PendingIntent.getActivity(
                          context,
                          appWidgetId,
                          launchIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val views = RemoteViews(context.packageName, R.layout.moti_widget)
                      views.setTextViewText(R.id.widget_phrase, phrase)
                      views.setOnClickPendingIntent(R.id.widget_root, pendingIntent)
                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
          KOTLIN

          python3 <<'PY'
          from pathlib import Path
          p = Path('generated_app/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          receiver = '''
                  <receiver
                      android:name=".MotiWidget"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/moti_widget_info" />
                  </receiver>
          '''
          s = s.replace('    </application>', receiver + '    </application>')
          p.write_text(s)
          PY

      - name: Resolve dependencies
        shell: bash
        run: |
          cd generated_app
          flutter pub get

      - name: Analyze Flutter v3 code
        shell: bash
        run: |
          cd generated_app
          flutter analyze lib

      - name: Build Animo Hoy v3 trial APK
        shell: bash
        run: |
          cd generated_app
          flutter build apk --release

      - name: Collect APK and source
        shell: bash
        run: |
          mkdir -p dist/source/lib
          cp generated_app/build/app/outputs/flutter-apk/app-release.apk dist/Animo-Hoy-Moti-v3.0.0-PRUEBA.apk
          cp animo-hoy-source/lib/main.dart dist/source/lib/main.dart
          cp animo-hoy-source/pubspec.yaml dist/source/pubspec.yaml
          cat > dist/LEEME.txt <<'TXT'
          Ánimo Hoy v3.0.0 - APK de prueba
          Incluye Moti rojo, sonidos por emoción, racha, estrellas, historial, guardado local,
          respiración guiada y un widget inicial para la pantalla principal de Android.
          TXT

      - name: Upload v3 build files
        uses: actions/upload-artifact@v4
        with:
          name: animo-hoy-moti-v3
          path: dist/*
          if-no-files-found: error
          retention-days: 7
