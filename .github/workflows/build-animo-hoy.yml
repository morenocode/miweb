name: Build Animo Hoy Android

on:
  push:
    branches:
      - build-animo-hoy-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create Flutter Android project
        shell: bash
        run: |
          rm -rf generated_app
          flutter create --platforms=android --org com.modu --project-name animohoy generated_app
          cp animo-hoy-source/pubspec.yaml generated_app/pubspec.yaml
          cp animo-hoy-source/lib/main.dart generated_app/lib/main.dart
          sed -i 's/android:label="animohoy"/android:label="Ánimo Hoy"/' generated_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' generated_app/android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' generated_app/android/app/build.gradle.kts
          cd generated_app
          flutter pub get

      - name: Create Moti app icon
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path('generated_app/android/app/src/main/res')
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          img = Image.new('RGB', (1024,1024), (120,103,232))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((215,250,809,845), radius=235, fill=(146,127,239))
          d.ellipse((342,465,406,529), fill=(48,40,70))
          d.ellipse((618,465,682,529), fill=(48,40,70))
          d.arc((390,500,650,715), 15, 165, fill=(48,40,70), width=34)
          d.ellipse((280,565,370,620), fill=(255,170,188))
          d.ellipse((654,565,744,620), fill=(255,170,188))
          d.ellipse((470,110,690,355), fill=(102,200,135))
          d.line((515,330,590,185), fill=(62,160,101), width=28)
          for folder, size in sizes.items():
              p = root / folder
              p.mkdir(parents=True, exist_ok=True)
              icon = img.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(p/'ic_launcher.png')
              icon.save(p/'ic_launcher_round.png')
          PY

      - name: Analyze Flutter code
        shell: bash
        run: |
          cd generated_app
          flutter analyze lib

      - name: Build trial APK
        shell: bash
        run: |
          cd generated_app
          flutter build apk --release

      - name: Collect APK and source
        shell: bash
        run: |
          mkdir -p dist
          cp generated_app/build/app/outputs/flutter-apk/app-release.apk dist/Animo-Hoy-Moti-v2.0.0-PRUEBA.apk
          cp animo-hoy-source/lib/main.dart dist/main.dart
          cp animo-hoy-source/pubspec.yaml dist/pubspec.yaml

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: animo-hoy-moti-v2
          path: dist/*
          if-no-files-found: error
          retention-days: 7
